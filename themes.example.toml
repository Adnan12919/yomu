# yomu loads custom themes from $XDG_CONFIG_HOME/yomu/themes.toml.
# This starter file is copied there on first launch. Changes take effect after
# selecting Reload custom themes in Settings.

name = "yomu custom themes"

[[themes]]
name = "Tokyo Night"
mode = "dark"
radius = 8
radius_lg = 12
shadow = true

[themes.colors]
background = "#1a1b26"
foreground = "#c0caf5"
"popover.background" = "#16161e"
"popover.foreground" = "#c0caf5"
"primary.background" = "#7aa2f7"
"primary.foreground" = "#15161e"
"primary.hover.background" = "#89ddff"
"secondary.background" = "#24283b"
"secondary.foreground" = "#c0caf5"
"secondary.hover.background" = "#292e42"
"muted.background" = "#24283b"
"muted.foreground" = "#565f89"
"accent.background" = "#24283b"
"accent.foreground" = "#c0caf5"
border = "#292e42"
"input.border" = "#292e42"
ring = "#7aa2f7"
"danger.background" = "#f7768e"
"danger.foreground" = "#15161e"
"button.background" = "#24283b"
"button.foreground" = "#c0caf5"
"button.hover.background" = "#292e42"
"button.primary.background" = "#7aa2f7"
"button.primary.foreground" = "#15161e"
"button.primary.hover.background" = "#89ddff"
"tab.background" = "#1a1b26"
"tab.foreground" = "#565f89"
"tab.active.background" = "#24283b"
"tab.active.foreground" = "#c0caf5"
"tab_bar.background" = "#16161e"
"tab_bar.segmented.background" = "#16161e"
"scrollbar.background" = "#24283b"
link = "#7aa2f7"
