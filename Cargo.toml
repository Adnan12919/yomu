[package]
name = "yomu"
version = "26.10.0"
edition = "2024"
rust-version = "1.89"
description = "A minimal, GPU-accelerated, Wayland-native manga reader with a library"
license = "MIT"

[lib]
name = "yomu"
path = "src/lib.rs"

[[bin]]
name = "yomu"
path = "src/main.rs"

[dependencies]
gpui = "0.2.2"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
# SIMD resampling for page and cover scaling (pure Rust, no C code): several times faster than the
# image crate's resize, which was the slowest step of showing a large page.
fast_image_resize = { version = "6", default-features = false, features = ["std"] }
# Pure-Rust decoders only: no C libraries get linked for image or archive handling.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
gpui = { version = "0.2.2", features = ["test-support"] }

[profile.release]
lto = "thin"
codegen-units = 4
strip = true

# Image decoding is painfully slow at opt-level 0, so optimise just those crates in dev builds.
[profile.dev.package.yomu]
opt-level = 2
[profile.dev.package.image]
opt-level = 3
[profile.dev.package.zune-jpeg]
opt-level = 3
[profile.dev.package.png]
opt-level = 3
[profile.dev.package.fdeflate]
opt-level = 3
[profile.dev.package.miniz_oxide]
opt-level = 3
[profile.dev.package.flate2]
opt-level = 3
[profile.dev.package.image-webp]
opt-level = 3

# xattr 0.2.3 (pulled in by gpui -> zed-async-tar) fails to compile against libc >= 0.2.183
# because ENOATTR disappeared on Linux. This vendored copy fixes that single constant.
[patch.crates-io]
xattr = { path = "vendor/xattr" }
# Drops the archived proc-macro-error2 from the dependency tree (see vendor/stacksafe-macro/Cargo.toml).
stacksafe-macro = { path = "vendor/stacksafe-macro" }
