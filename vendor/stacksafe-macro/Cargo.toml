# Local copy of stacksafe-macro 0.1.4 for the yomu build.
#
# gpui 0.2.2 pins `stacksafe =0.1.4`, whose proc-macro crate depends on `proc-macro-error2`
# (archived / unmaintained). Upstream fixed that in stacksafe-macro 1.0.2 by returning
# `syn::Error` instead of using proc-macro-error2's `abort!`; `src/lib.rs` here is that
# upstream 1.0.2 source (Apache-2.0, FastLabs Developers). Everything else matches 0.1.4, in
# particular the version, so gpui's exact requirement is still satisfied.
[package]
name = "stacksafe-macro"
version = "0.1.4"
edition = "2021"
rust-version = "1.80.0"
description = "Procedural macro implementation for the stacksafe crate."
license = "Apache-2.0"
repository = "https://github.com/fast/stacksafe"
autotests = false
autobenches = false

[lib]
name = "stacksafe_macro"
path = "src/lib.rs"
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }
